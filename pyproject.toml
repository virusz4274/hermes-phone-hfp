[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfp-mcp"
version = "0.1.0"
description = "MCP server for Bluetooth HFP phone calling on Linux / Raspberry Pi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0",
    "dbus-python>=1.3.2",
    "PyGObject>=3.48.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]
# Call audio uses direct Bluetooth SCO sockets. The realtime sidecar uses
# Starlette/uvicorn for binary WebSocket audio streaming.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]
gemini-live = [
    "google-genai>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
hfp-mcp-server = "hfp_mcp.server:main"
hfp-mcp-gemini-orchestrator = "hfp_mcp.gemini_orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
