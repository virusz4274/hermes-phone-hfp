[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfp-mcp"
version = "0.1.0"
description = "MCP server for Bluetooth HFP phone calling on Linux / Raspberry Pi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0",
    "dbus-python>=1.3.2",
    "PyGObject>=3.48.0",
]
# Audio capture/playback uses the parec/pacat CLI tools (pulseaudio-utils),
# not a Python audio library — see src/hfp_mcp/audio/capture.py.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hfp-mcp-server = "hfp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
