name: CI
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast unit and syntax test that runs on every push and PR (~1 minute)
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libglib2.0-dev libcairo2-dev libgirepository-2.0-dev pkg-config
      - name: Install dependencies
        run: python -m pip install -e '.[daemon,dev,gemini-live]' -c setup/test-constraints.txt
      - name: Run tests
        run: python -m pytest -q -o faulthandler_timeout=60
      - name: Validate shell syntax
        run: bash -n setup/install.sh

  # Packaging smoke test: Only runs on release tags (v*) or manual dispatch
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py dist/*
      - name: Install each artifact outside checkout in fresh venv
        shell: bash
        run: |
          for artifact in dist/*; do
            artifact_path="$(realpath "$artifact")"
            smoke_root="$(mktemp -d)"
            python -m venv "$smoke_root/venv"
            "$smoke_root/venv/bin/python" -m pip install "$artifact_path"
            "$smoke_root/venv/bin/python" -m pip check
            (
              cd "$smoke_root"
              "$smoke_root/venv/bin/python" -c 'import importlib.util; import hfp_mcp.hermes_bridge, hfp_mcp.phone_tasks; assert importlib.util.find_spec("dbus") is None; assert importlib.util.find_spec("gi") is None; assert importlib.util.find_spec("mcp") is None'
              "$smoke_root/venv/bin/hfp-mcp" doctor --help
            )
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
