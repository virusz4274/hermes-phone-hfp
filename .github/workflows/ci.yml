name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit and syntax checks for main pushes, PRs, and manual runs
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libglib2.0-dev libcairo2-dev libgirepository-2.0-dev pkg-config
      - name: Install dependencies
        run: python -m pip install -e '.[daemon,dev,gemini-live]' -c setup/test-constraints.txt
      - name: Run tests
        run: python -m pytest -q -o faulthandler_timeout=60
      - name: Validate shell syntax
        run: bash -n setup/install.sh

  # Native imports and wheel environments on supported host Python minors.
  native-runtime:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ['debian:bookworm', 'ubuntu:24.04', 'debian:trixie']
    steps:
      - uses: actions/checkout@v4
      - name: Host Python and native bindings
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-dev python3-venv python3-dbus python3-gi python3-gi-cairo gir1.2-glib-2.0 libsoxr-dev build-essential cmake pkg-config
          useradd --create-home hfp-ci
      - name: Prepare a wheel-based environment as an unprivileged user
        shell: bash
        run: |
          runuser -u hfp-ci -- env PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          from pathlib import Path
          import shutil, tempfile
          from setup import runtime
          source = Path.cwd()
          root = Path(tempfile.mkdtemp(prefix='hfp-native-'))
          try:
              for name in ('pyproject.toml', 'README.md', 'LICENSE'):
                  shutil.copy2(source / name, root / name)
              shutil.copytree(source / 'src', root / 'src', ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
              info = runtime.probe_python('/usr/bin/python3', native=True)
              candidate = runtime.build_environment(root, info, ['daemon', 'gemini-live'])
              runtime.activate(root, candidate)
              selected, record = runtime.read_installation(root)
              assert selected == candidate and record['wheel_sha256']
          finally:
              shutil.rmtree(root)
          PY

  # Packaging smoke test for PRs to main and manual runs
  package-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.13', '3.14']
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py dist/*
      - name: Install each artifact outside checkout in fresh venv
        shell: bash
        run: |
          for artifact in dist/*; do
            artifact_path="$(realpath "$artifact")"
            smoke_root="$(mktemp -d)"
            python -m venv "$smoke_root/venv"
            "$smoke_root/venv/bin/python" -m pip install "$artifact_path"
            "$smoke_root/venv/bin/python" -m pip check
            (
              cd "$smoke_root"
              "$smoke_root/venv/bin/python" -c 'import importlib.util; import hfp_mcp.hermes_bridge, hfp_mcp.phone_tasks; assert importlib.util.find_spec("dbus") is None; assert importlib.util.find_spec("gi") is None; assert importlib.util.find_spec("mcp") is None'
              "$smoke_root/venv/bin/hfp-mcp" doctor --help
            )
          done
