## WirePlumber config: enable HFP Hands-Free role and CVSD audio.
## Place at: /etc/wireplumber/wireplumber.conf.d/99-hfp-audio.conf
## Then restart: systemctl --user restart wireplumber

bluez_monitor.properties = {
  ## Enable HSP HS and HFP HF roles (headset/hands-free unit side)
  ["bluez5.headset-roles"] = "[ hsp_hs hfp_hf ]",

  ## Keep mSBC disabled to use standard 8 kHz CVSD audio.
  ## Enable mSBC for 16 kHz wideband audio (requires handling +BCS:2 AT command):
  ## ["bluez5.enable-msbc"] = true,
  ["bluez5.enable-msbc"] = false,

  ## Allow hardware volume control passthrough
  ["bluez5.enable-hw-volume"] = true,
}
