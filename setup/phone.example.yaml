# Replace the calling number; merge phone into any existing config.
# Optional guest blocks require a restricted profile: docs/phone-routing.md.
phone:
  version: 1
  default_region: IN
  # outbound_endpoint: personal  # Set when enabling a second endpoint below.
  endpoints:
    personal:
      profile: default
      url: http://127.0.0.1:8642
      # Variable names, not secrets. Set their values in ~/.config/hfp-mcp.env.
      # Match Hermes .env: API_SERVER_KEY and HFP_HERMES_BRIDGE_KEY respectively.
      token_env: HFP_HERMES_API_KEY
      bridge_token_env: HFP_HERMES_BRIDGE_KEY
    # Optional restricted profile; uncomment with the policies/routes below.
    # guest:
    #   profile: guest
    #   url: http://127.0.0.1:8643
    #   token_env: HFP_GUEST_API_KEY
    #   bridge_token_env: HFP_GUEST_BRIDGE_KEY
  policies:
    admin:
      admin: true  # Normal Hermes approvals still apply.
      max_minutes: 60
    # known:
    #   tools: [hfp_caller_read, hfp_caller_update]  # Own saved notes only.
    # guest:
    #   tools: []  # Conversation only.
    #   remember: false
  numbers:
    # Your calling number, not the paired handset's SIM number.
    "+919876543210":
      endpoint: personal
      policy: admin
      continuity: true  # Resume this caller's saved conversation.
    # "+919876543211":
    #   endpoint: guest
    #   policy: known
  # No default: unmatched/withheld callers are declined.
  # To answer them after preparing the guest profile, uncomment:
  # default:
  #   endpoint: guest
  #   policy: guest
