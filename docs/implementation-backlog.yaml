  - id: WORKFLOW-01
    title: Hermes-owned phone objectives and bounded follow-up
    kind: implementation
    priority: 1
    depends_on:
    - TASK-01
    - TASK-02
    status: in_progress
    spec_ref: docs/implementation-spec.md#workflow-01
    source_refs:
    - path: TODO.md
      item: Phone objectives and follow-up
    entry_points:
    - src/hfp_mcp/phone_workflows.py
    - src/hfp_mcp/phone_workflow_runner.py
    - src/hfp_mcp/workflow_execution.py
    - tests/test_phone_workflows.py
    - tests/test_workflow_execution.py
    requirements:
    - Hermes owns native schedules and follow-up decisions; the plugin executes admitted calls and returns
      exact-call evidence.
    - Keep original objective/date, narrow authority, durable attempts, verified progress, native identities,
      and report claims across restarts.
    - Save the configured retry policy per request. Default to an initial attempt plus three automatic
      retries after 10, 30 and 60 minutes from each unsuccessful call's end; positive integer delays have
      a one-minute minimum, and an empty list disables retries. Explicit recipient continuations preserve
      the chain's automatic retry budget without consuming it. Keep seven-day expiry, earlier explicit
      deadlines and 08:00–22:00 automatic hours; explicit owner/recipient times retain the hours exception.
    - Require the recipient's resolved profile to match the originating workflow profile; lookup grants
      do not grant cross-profile call authority. Raw purpose-free controls use their separate path.
    - Retain outcomes, decisions and verified schedules in status. Send no routine retry, completion,
      refusal or cancellation report. Gateway notices cover exhaustion, expiry or outcomes requiring
      guidance; call-only reminders send none. Both-mode reminders retain their initial notification.
    - Require evidence for completion/refusal/deferral; uncertain or still-active calls, ambiguity and
      missing capabilities require guidance. Exhaustion ends automatic retries.
    - Cancellation prevents future attempts and late decisions without hanging up an admitted call. Native
      delivery owns report receipts/retry policy; the plugin never republishes an uncertain report claim.
    acceptance:
    - id: WORKFLOW-01-A1
      scenario: Create/replay a native request, lose its creation response, repeat execution, and recover
        a missing dial receipt.
      expected: One job/attempt identity survives; duplicate or uncertain execution never redials.
      verification: automated
      status: passed
      evidence:
      - command_or_procedure: PYTHONPATH=src .venv/bin/python -m pytest -q tests/test_phone_workflows.py
          tests/test_workflow_execution.py tests/test_reminders.py tests/test_owner_notes.py
        result: 61 passed, one existing Starlette warning, 2.58 seconds on 2026-10-09; scoped synthetic
          regressions only, no live calls or messages.
        tested_revision: 2026-10-09 working tree based on 1d3a405; source tests, not a committed release
        references:
        - docs/hermes-owner-flow-verification-2026-10-08.md
        - tests/test_phone_workflows.py
